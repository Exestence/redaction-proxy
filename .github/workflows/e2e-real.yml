# Real-service harness (e2e/real). Manual only: it spends API credits. A provider whose
# repository secret (OPENAI_API_KEY, ANTHROPIC_API_KEY, DEEPSEEK_API_KEY) is unset is skipped.
name: Real-service e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run e2e:real
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
