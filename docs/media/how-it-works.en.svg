<svg xmlns="http://www.w3.org/2000/svg" width="980" height="556" viewBox="0 0 980 556" role="img" lang="en" aria-labelledby="title">
<title id="title">How redaction-proxy handles a request</title>
<style>
text{font-family:"Segoe UI", "Helvetica Neue", Arial, system-ui, -apple-system, "PingFang TC", "PingFang SC", "Hiragino Sans", "Noto Sans CJK TC", "Noto Sans CJK SC", "Noto Sans CJK JP", "Microsoft JhengHei", "Microsoft YaHei", sans-serif;font-size:12.5px;fill:#1c2120}
.t{font-size:15px;font-weight:600}
.s,.nl{fill:#5b6562}
.zl{font-size:13px;font-weight:600;fill:#5b6562}
.wl{fill:#a3352b;font-weight:600}
.gl{fill:#2f8a4e;font-weight:600}
.bg{fill:#f6f7f6}
.zone{fill:#eef2f0;stroke:#c9d1ce;stroke-width:1.5}
.zone2{fill:#e6ece9;stroke:#c9d1ce;stroke-width:1.2}
.cloudz{fill:#e9f0fb;stroke:#5b7fb8;stroke-width:1.5}
.box{fill:#fff;stroke:#c9d1ce;stroke-width:1.5}
.gate{fill:#fdf6ea;stroke:#b9771b;stroke-width:1.8}
.act{fill:#eef4fb;stroke:#3f6fa6;stroke-width:1.8}
.cbox{fill:#fff;stroke:#5b7fb8;stroke-width:1.8}
.ln{stroke:#5b6562;stroke-width:1.6;fill:none}
.out{stroke:#2f8a4e;stroke-width:3.5;fill:none}
.stopln{stroke:#a3352b;stroke-width:1.6;fill:none}
.wall{stroke:#a3352b;stroke-width:2;stroke-dasharray:8 6;fill:none}
.ah{fill:#5b6562}.ahg{fill:#2f8a4e}.ahs{fill:#a3352b}
@media (prefers-color-scheme: dark){
text{fill:#e2e7e5}
.s,.nl,.zl{fill:#9aa5a1}
.wl{fill:#ec8a80}
.gl{fill:#6fcf8d}
.bg{fill:#141817}
.zone{fill:#1a201e;stroke:#3a4440}
.zone2{fill:#202725;stroke:#3a4440}
.cloudz{fill:#1a2333;stroke:#86a6db}
.box{fill:#1c2220;stroke:#3a4440}
.gate{fill:#2a2216;stroke:#e0a85a}
.act{fill:#18212c;stroke:#8db3e2}
.cbox{fill:#1c2220;stroke:#86a6db}
.ln{stroke:#9aa5a1}
.out{stroke:#6fcf8d}
.stopln,.wall{stroke:#ec8a80}
.ah{fill:#9aa5a1}.ahg{fill:#6fcf8d}.ahs{fill:#ec8a80}
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" class="ahg"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ahs"/></marker>
</defs>
<rect width="980" height="556" rx="12" class="bg"/>
<rect x="20" y="20" width="770" height="490" rx="14" class="zone"/>
<text x="36" y="44" class="zl" text-anchor="start">Your computer</text>
<rect x="820" y="20" width="140" height="490" rx="14" class="cloudz"/>
<text x="836" y="44" class="zl" text-anchor="start">Cloud</text>
<line x1="805" y1="30" x2="805" y2="500" class="wall"/>
<rect x="186" y="58" width="592" height="440" rx="10" class="zone2"/>
<text x="200" y="80" class="zl" text-anchor="start">redaction-proxy (127.0.0.1:8787)</text>
<rect x="36" y="96" width="134" height="86" rx="8" class="box"/>
<text x="103" y="125" class="t" text-anchor="middle">Your tool</text>
<text x="103" y="144" class="s" text-anchor="middle">Claude Code, SDK…</text>
<text x="103" y="163" class="s" text-anchor="middle">with its own API key</text>
<rect x="200" y="100" width="132" height="90" rx="8" class="gate"/>
<text x="266" y="121.5" class="t" text-anchor="middle">Gate checks</text>
<text x="266" y="140.5" class="s" text-anchor="middle">origin, host</text>
<text x="266" y="159.5" class="s" text-anchor="middle">auth token</text>
<text x="266" y="178.5" class="s" text-anchor="middle">route, size</text>
<rect x="346" y="100" width="132" height="90" rx="8" class="act"/>
<text x="412" y="131" class="t" text-anchor="middle">Collect text</text>
<text x="412" y="150" class="s" text-anchor="middle">skip ids, URLs, files</text>
<text x="412" y="169" class="s" text-anchor="middle">screen control chars</text>
<rect x="492" y="100" width="132" height="90" rx="8" class="act"/>
<text x="558" y="121.5" class="t" text-anchor="middle">Detect</text>
<text x="558" y="140.5" class="s" text-anchor="middle">rules, your terms,</text>
<text x="558" y="159.5" class="s" text-anchor="middle">name model,</text>
<text x="558" y="178.5" class="s" text-anchor="middle">memory</text>
<rect x="638" y="100" width="132" height="90" rx="8" class="act"/>
<text x="704" y="131" class="t" text-anchor="middle">Mask</text>
<text x="704" y="150" class="s" text-anchor="middle">each value becomes</text>
<text x="704" y="169" class="s" text-anchor="middle">⟦EMAIL_1⟧ …</text>
<path d="M170 145 H198" class="ln" marker-end="url(#a)"/>
<path d="M332 145 H344" class="ln" marker-end="url(#a)"/>
<path d="M478 145 H490" class="ln" marker-end="url(#a)"/>
<path d="M624 145 H636" class="ln" marker-end="url(#a)"/>
<path d="M240 190 V210" class="stopln" marker-end="url(#as)"/>
<text x="200" y="229" class="wl" text-anchor="start">403 / 401 / 404 / 413, not sent</text>
<text x="200" y="251" class="nl" text-anchor="start">GET: relayed as is, not masked</text>
<path d="M704 190 V240" class="ln" marker-end="url(#a)"/>
<rect x="638" y="242" width="132" height="80" rx="8" class="gate"/>
<text x="704" y="268" class="t" text-anchor="middle">Leak scan</text>
<text x="704" y="287" class="s" text-anchor="middle">detected value</text>
<text x="704" y="306" class="s" text-anchor="middle">still in the request?</text>
<path d="M638 282 H600" class="stopln" marker-end="url(#as)"/>
<text x="592" y="278" class="wl" text-anchor="end">422, not sent (default)</text>
<text x="592" y="298" class="nl" text-anchor="end">sendWhenMaskFails: sent anyway</text>
<rect x="830" y="238" width="120" height="88" rx="8" class="cbox"/>
<text x="890" y="258.5" class="t" text-anchor="middle">Cloud LLM</text>
<text x="890" y="277.5" class="s" text-anchor="middle">OpenAI- or</text>
<text x="890" y="296.5" class="s" text-anchor="middle">Anthropic-</text>
<text x="890" y="315.5" class="s" text-anchor="middle">compatible</text>
<path d="M770 282 H828" class="out" marker-end="url(#ag)"/>
<text x="890" y="207" class="gl" text-anchor="middle">masked request</text>
<text x="890" y="226" class="gl" text-anchor="middle">(default)</text>
<path d="M890 326 V412 H652" class="out" marker-end="url(#ag)"/>
<text x="662" y="383" class="lbl" text-anchor="start">reply with</text>
<text x="662" y="402" class="lbl" text-anchor="start">placeholders</text>
<rect x="300" y="344" width="350" height="144" rx="8" class="act"/>
<text x="475" y="368" class="t" text-anchor="middle">Restore the reply</text>
<text x="475" y="388" class="s" text-anchor="middle">whole JSON, or SSE as it streams</text>
<text x="318" y="412" class="lbl" text-anchor="start">reply text → restored</text>
<text x="318" y="431" class="lbl" text-anchor="start">inside a URL → stays a placeholder</text>
<text x="318" y="450" class="lbl" text-anchor="start">tool-call arguments → allowed categories only</text>
<text x="332" y="469" class="lbl" text-anchor="start">(default PATH, TERM, PROJECT)</text>
<path d="M300 412 H103 V184" class="ln" marker-end="url(#a)"/>
<text x="196" y="402" class="lbl" text-anchor="start">restored reply</text>
<line x1="24" y1="532" x2="46" y2="532" class="out"/>
<text x="54" y="536" class="lg" text-anchor="start">detected values leave only as placeholders (default)</text>
<rect x="444" y="525" width="22" height="14" rx="3" class="gate"/>
<text x="474" y="536" class="lg" text-anchor="start">check</text>
<rect x="535" y="525" width="22" height="14" rx="3" class="act"/>
<text x="565" y="536" class="lg" text-anchor="start">action</text>
<line x1="633" y1="532" x2="655" y2="532" class="stopln"/>
<text x="663" y="536" class="lg" text-anchor="start">refused, not sent</text>
<line x1="808" y1="532" x2="830" y2="532" class="wall"/>
<text x="838" y="536" class="lg" text-anchor="start">privacy boundary</text>
</svg>
