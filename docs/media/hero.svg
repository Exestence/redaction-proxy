<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc">
  <title id="title">How redaction-proxy works</title>
  <desc id="desc">Your AI tool sends a prompt to redaction-proxy on 127.0.0.1. The proxy replaces lin@example.test with the placeholder EMAIL_1 before the request reaches the cloud LLM. The reply comes back with the placeholder, and the proxy puts lin@example.test back before your tool sees it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .box-title { font-size: 20px; font-weight: 600; }
      .box-sub { font-size: 14px; }
      .pill { font-size: 15px; }
      .note { font-size: 14px; fill: #8b949e; }
      .line { stroke: #8b949e; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <!-- Your tool -->
  <rect x="20" y="70" width="200" height="190" rx="14" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
  <text x="120" y="155" text-anchor="middle" class="box-title" fill="#0a3069">Your AI tool</text>
  <text x="120" y="180" text-anchor="middle" class="box-sub" fill="#0a3069">Claude Code, SDKs, curl</text>

  <!-- Proxy -->
  <rect x="380" y="40" width="200" height="250" rx="14" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"/>
  <text x="480" y="78" text-anchor="middle" class="box-title" fill="#044f1e">redaction-proxy</text>
  <text x="480" y="100" text-anchor="middle" class="box-sub mono" fill="#044f1e">127.0.0.1:8787</text>
  <rect x="405" y="122" width="150" height="40" rx="8" fill="#ffffff" stroke="#4ac26b"/>
  <text x="480" y="148" text-anchor="middle" class="box-sub" font-weight="600" fill="#044f1e">1. mask</text>
  <rect x="405" y="222" width="150" height="40" rx="8" fill="#ffffff" stroke="#4ac26b"/>
  <text x="480" y="248" text-anchor="middle" class="box-sub" font-weight="600" fill="#044f1e">2. restore</text>

  <!-- Cloud LLM -->
  <rect x="740" y="70" width="200" height="190" rx="14" fill="#fff8c5" stroke="#d4a72c" stroke-width="2"/>
  <text x="840" y="155" text-anchor="middle" class="box-title" fill="#4d2d00">Cloud LLM</text>
  <text x="840" y="180" text-anchor="middle" class="box-sub" fill="#4d2d00">OpenAI, Anthropic,</text>
  <text x="840" y="198" text-anchor="middle" class="box-sub" fill="#4d2d00">DeepSeek, …</text>

  <!-- Request path -->
  <path class="line" d="M220 142 H403" marker-end="url(#arrow)"/>
  <path class="line" d="M555 142 H738" marker-end="url(#arrow)"/>
  <!-- Reply path -->
  <path class="line" d="M740 242 H557" marker-end="url(#arrow)"/>
  <path class="line" d="M405 242 H222" marker-end="url(#arrow)"/>

  <!-- Labels on the request path -->
  <rect x="227" y="104" width="170" height="28" rx="14" fill="#f6f8fa" stroke="#8b949e"/>
  <text x="312" y="123" text-anchor="middle" class="pill mono" fill="#1f2328">lin@example.test</text>
  <rect x="580" y="104" width="134" height="28" rx="14" fill="#f6f8fa" stroke="#8b949e"/>
  <text x="647" y="123" text-anchor="middle" class="pill mono" fill="#1f2328">⟦EMAIL_1⟧</text>
  <!-- Labels on the reply path -->
  <rect x="580" y="252" width="134" height="28" rx="14" fill="#f6f8fa" stroke="#8b949e"/>
  <text x="647" y="271" text-anchor="middle" class="pill mono" fill="#1f2328">⟦EMAIL_1⟧</text>
  <rect x="227" y="252" width="170" height="28" rx="14" fill="#f6f8fa" stroke="#8b949e"/>
  <text x="312" y="271" text-anchor="middle" class="pill mono" fill="#1f2328">lin@example.test</text>

  <line x1="727" y1="34" x2="727" y2="296" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="715" y="26" text-anchor="end" class="note">your machine</text>
  <text x="739" y="26" class="note">the internet</text>
  <text x="480" y="318" text-anchor="middle" class="note">The cloud sees placeholders; your tool gets the real values back.</text>
</svg>
